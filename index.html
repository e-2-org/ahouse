<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a house is not a home</title>
<meta name="description" content="A House Is Not A Home by Geraint Evans: drawn images and simple animation make an uneasy interactive journey through a suburban dwelling.">
<!--
    a house is not a home: images copyright Geraint Evans 1997, technical direction Chris Panton (Panart), produced by e-2

    Each scene is an SVG the size of the original pages (650 x 500), named after the page it was
    (fr.html is #fr). Its links are rectangles over the drawing, from the pages' image maps, or the
    images themselves where a page was built from several. :target shows the scene in the address,
    and #fr, the front of the house, when there isn't one.
-->
<style>
html, body {
    margin: 0;
    height: 100%;
}
body {
    background: #182224;
}
/* two scenes (sia, tba) had a lighter background */
body:has(svg[data-background]:target) {
    background: #41484c;
}
main {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
}
svg {
    display: none;
    /* as large as the window allows, at 650 x 500 */
    width: min(100vw, 100dvh * 650 / 500);
    height: auto;
}
svg:target,
main:not(:has(svg:target)) #fr {
    display: block;
}
/* the image map areas: invisible, but there for the pointer */
rect {
    fill: transparent;
}
a {
    cursor: pointer;
}
a:focus {
    outline: none;
}
a:focus-visible rect {
    stroke: #9999bb;
    stroke-width: 2;
    stroke-dasharray: 4 4;
}
a:focus-visible image {
    opacity: .85;
}
/* the front door, lit up under the pointer */
.over {
    opacity: 0;
}
a:hover .over,
a:focus-visible .over {
    opacity: 1;
}
</style>
</head>
<body>
<main>
    <svg id="fr" viewBox="0 0 650 500">

        <image href="fr2.gif" x="230" y="0" width="420" height="500"/>
    </svg>

<script>
/* load every drawing now, so each scene appears straight away */
new Set([...document.querySelectorAll('image')].map(image => image.getAttribute('href')))
